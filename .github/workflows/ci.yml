name: CI

# AinkradAppKit is the ABI contract every plugin in the family binds to, and
# until now it had no .github directory at all — `make abi-check` ran only when
# someone remembered, which is how its baseline drifted four commits behind
# without anyone noticing.
#
# This workflow is NOT dormant: Build and Test run fine on macos-latest, which
# lacks the Xcode-beta SDK — the package doesn't actually need it for those
# steps. ABI check used to fail here because the Makefile unconditionally
# forced DEVELOPER_DIR to Xcode-beta's path even when it didn't exist. The
# Makefile now falls back to `xcode-select -p` itself whenever Xcode-beta is
# absent and DEVELOPER_DIR wasn't supplied, so the "Select toolchain" step
# below is only a no-op safety net on runners that DO have Xcode-beta — it no
# longer needs to "win" over anything. The reason the check exists at all: an
# added protocol requirement is the one ABI break library evolution does NOT
# cover — an already-installed plugin has no witness for it and fails to
# load. Nothing in a normal build catches that; this does.

on:
  push:
    branches: [master, main, development]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select toolchain
        run: |
          if [[ -d /Applications/Xcode-beta.app ]]; then
            echo "DEVELOPER_DIR=/Applications/Xcode-beta.app/Contents/Developer" >> "$GITHUB_ENV"
          fi

      - name: Build
        run: swift build -c release

      - name: Test
        run: swift test

      # The point of this workflow. An added protocol requirement is the one
      # ABI break library evolution does NOT cover: an already-installed plugin
      # has no witness for it and fails to load. Nothing in a normal build
      # catches that; this does.
      - name: ABI check
        run: make abi-check

      - name: Upload ABI report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: abi-report
          path: abi/report.txt
